        <div class="col mt-5">
                <iframe class="border border-2 border-light p-0" width="560" height="315" src="https://www.youtube.com/embed/CU7u97wrTNo?si=os6L2G8FQK-zdP0A"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="col mt-5">
            <h2 class="collapse">Feedback</h2>
            <form name="feedback" action="fake.php">
                <div class="form-floating mb-3">
                    <input class="form-control" type="text" id="fname" name="fname" placeholder="anonymous" required>
                    <label for="fname">First Name:</label>
                    <small class="form-text text-muted">Your first name</small>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" type="text" id="lname" name="lname" placeholder="anonymous" required>
                    <label for="lname">Last Name:</label>
                    <small class="form-text text-muted">Your last name</small>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" type="email" id="mail" name="mail" placeholder="name@domain.com" required>
                    <label for="mail">Email:</label>
                    <small class="form-text text-muted">Your email address</small>
                </div>

                <div class="mb-3">
                    <p class="form-label">Would you recommend this site to a friend?</p>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="yes_recommend" name="recommend" value="yes">
                        <label class="form-check-label" for="yes_recommend">Yes</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="no_recommend" name="recommend" value="no">
                        <label class="form-check-label spinner-border" for="no_recommend">No</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="fav_website">What is your favorite website?</label>
                    <select class="form-control form-select" name="fav_website" id="fav_website">
                        <option value="google">Google</option>
                        <option value="facebook">Facebook</option>
                        <option value="twitter">Twitter</option>
                        <option value="msn">MSN</option>
                        <option value="youtube">YouTube</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="rating">Please rate the website (1-10):</label>
                    <input class="form-range" type="range" name="rating" id="rating" min="1" max="10" value="5" step="1">
                </div>
    
                <div class="mb-3">
                    <label class="form-label" for="comment">Leave additional comments:</label>
                    <textarea class="form-control" name="comment" id="comment" rows="4" cols="50"></textarea>
                </div>

                <!-- Other HTML5 Form Features -->
                <div class="mb-3">
                    <label class="form-label" for="color">Choose your favorite color:</label>
                    <input class="form-control" type="color" name="color" id="color">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="fav_number">What is your favorite number?</label>
                    <input class="form-control" type="number" name="fav_number" id="fav_number" min="1" max="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="vibe_month">Choose a month you vibe with:</label>
                    <input class="form-control" type="month" name="vibe_month" id="vibe_month">
                </div>

                <button class="btn btn-primary rounded-pill" type="submit">Submit</button>
            </form>
